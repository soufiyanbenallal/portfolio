document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

500; opacity: .78\"><a href=\"https://www.npmjs.com/~beyonder.sb\" target=\"_blank\" rel=\"noreferrer\">Packages published as beyonder.sb ↗<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"border: 3px solid var(--ink, #16150F); border-radius: var(--rad, 0px); background: var(--sec, #6FA8FF); color: var(--ink, #16150F); padding: 18px\">\n        <div style=\"font-size: 40px; font-weight: 900; letter-spacing: -.04em; line-height: 1; margin-bottom: 8px\">MSc<\u002Fdiv>\n        <div style=\"font-size: 13px; line-height: 1.45; font-weight: 500\">Computer Science · 2025, JUST China<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"work\" style=\"max-width: 1240px; margin: 0 auto; padding: clamp(52px, 9vh, 100px) clamp(16px, 4vw, 40px) 0; scroll-margin-top: 76px\">\n    <div style=\"max-width: 62ch; margin-bottom: clamp(26px, 4vh, 44px)\">\n      <div style=\"display: inline-block; font-family: 'Roboto Mono', monospace; font-size: 11.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; background: var(--ink, #16150F); color: var(--paper, #FDF6EC); padding: 4px 9px; border-radius: var(--rad, 0px); margin-bottom: 14px\">Selected work<\u002Fdiv>\n      <h2 style=\"font-size: clamp(30px, 3.6vw, 46px); font-weight: 900; letter-spacing: -.035em; line-height: 1.06; margin: 0 0 14px; text-wrap: pretty\">Five engagements, drawn flat<\u002Fh2>\n      <p style=\"font-size: 16.5px; line-height: 1.58; margin: 0; opacity: .8\">The two most recent carry the weight: a lead role owning strategy and architecture, and three years inside the Shopify ecosystem.<\u002Fp>\n    <\u002Fdiv>\n\n    <article data-reveal=\"\" style=\"border: 3px solid var(--ink, #16150F); border-radius: var(--rad, 0px); background: var(--paper, #FDF6EC); box-shadow: 10px 10px 0 var(--ink, #16150F); margin-bottom: 34px\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr))\">\n        <div style=\"padding: clamp(24px, 3.2vw, 40px)\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px\">\n            <span style=\"background: var(--acc, #E8562A); color: var(--paper, #FDF6EC); font-family: 'Roboto Mono', monospace; font-size: 11.5px; font-weight: 500; padding: 4px 9px; border-radius: var(--rad, 0px); border-radius: var(--rad, 0px)\">01 · CURRENT<\u002Fspan>\n            <span style=\"font-size: 13px; opacity: .7\">Ader Solutions · Rabat · 2023 — present<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-size: clamp(23px, 2.6vw, 34px); font-weight: 900; letter-spacing: -.03em; line-height: 1.1; margin: 0 0 14px; text-wrap: pretty\">Owning the technology strategy of a product company — and the architecture underneath it<\u002Fh3>\n          <p style=\"font-size: 16px; line-height: 1.6; margin: 0 0 14px; opacity: .82\">Hired to lead full-stack engineering. The role spans two things most companies split in half: defining what gets built and the roadmap it follows, then designing the scalable, secure, maintainable architecture that carries it.<\u002Fp>\n          <p style=\"font-size: 16px; line-height: 1.6; margin: 0 0 22px; opacity: .82\">React, TypeScript, Node.js, Laravel and Shopify in the codebase; code review, CI/CD and deployment discipline around it; a team of engineers mentored toward the same standards.<\u002Fp>\n\n          <div style=\"border-top: 3px solid var(--ink, #16150F); margin-bottom: 20px\">\n            <div style=\"display: grid; grid-template-columns: minmax(90px, 110px) 1fr; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--ink, #16150F)\">\n              <span style=\"font-family: 'Roboto Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .6\">Role<\u002Fspan>\n              <span style=\"font-size: 14.5px; line-height: 1.5; font-weight: 500\">Lead Full Stack — strategy, architecture, delivery, mentoring<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: minmax(90px, 110px) 1fr; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--ink, #16150F)\">\n              <span style=\"font-family: 'Roboto Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .6\">Decisions<\u002Fspan>\n              <span style=\"font-size: 14.5px; line-height: 1.5; font-weight: 500\">Security and maintainability first; CI/CD as a default; AI integrated where it changes the product<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: minmax(90px, 110px) 1fr; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--ink, #16150F)\">\n              <span style=\"font-family: 'Roboto Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .6\">Impact<\u002Fspan>\n              <span style=\"font-size: 14.5px; line-height: 1.5; font-weight: 500\">Engineering practice standardised across the team; product innovation driven by AI and modern web tooling<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n            <span style=\"border: 2px solid var(--ink, #16150F); border-radius: var(--rad, 0px); padding: 5px 10px; border-radius: var(--rad, 0px); font-size: 12.5px; font-weight: 500\">React<\u002Fspan>\n            <span style=\"border: 2px solid var(--ink, #16150F); border-radius: var(--rad, 0px); padding: 5px 10px; border-radius: var(--rad, 0px); font-size: 12.5px; font-weight: 500\">TypeScript<\u002Fspan>\n            <span style=\"border: 2px solid var(--ink, #16150F); border-radius: var(--rad, 0px); padding: 5px 10px; border-radius: var(--rad, 0px); font-size: 12.5px; font-weight: 500\">Node.js<\u002Fspan>\n            <span style=\"border: 2px solid var(--ink, #16150F); border-radius: var(--rad, 0px); padding: 5px 10px; border-radius: va order-radius: var(--rad, 0px); border-radius: var(--rad, 0px)\">02 · COMMERCE<\u002Fspan>\n            <span style=\"font-size: 13px; opacity: .75\">Le Ventures · Remote, U.S. · 2020 — 2023<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-size: clamp(23px, 2.6vw, 34px); font-weight: 900; letter-spacing: -.03em; line-height: 1.1; margin: 0 0 14px; text-wrap: pretty\">Shopify apps, custom themes and SaaS that merchants run their stores on<\u002Fh3>\n          <p style=\"font-size: 16px; line-height: 1.6; margin: 0 0 14px; opacity: .82\">Three years inside the Shopify ecosystem: embedded apps, Liquid themes on Online Store 2.0, and SaaS tooling around them — built for merchants who lose money when something breaks.<\u002Fp>\n          <p style=\"font-size: 16px; line-height: 1.6; margin: 0 0 22px; opacity: .82\">React and TypeScript on the front, Node.js and Laravel behind it, wired into Shopify APIs, webhooks and third-party platforms. Delivered from Morocco into a U.S. Agile team — the timezone was never the constraint.<\u002Fp>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 14px; margin-bottom: 22px\">\n            <div style=\"border: 3px solid var(--paper, #FDF6EC); border-radius: var(--rad, 0px); padding: 14px\">\n              <div style=\"font-size: 26px; font-weight: 900; letter-spacing: -.035em; margin-bottom: 5px\">2<span style=\"font-size: 15px\">yr<\u002Fspan>3<span style=\"font-size: 15px\">mo<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size: 12.5px; font-weight: 500; opacity: .78\">Fully remote with a U.S. team<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border: 3px solid var(--paper, #FDF6EC); border-radius: var(--rad, 0px); padding: 14px\">\n              <div style=\"font-size: 26px; font-weight: 900; letter-spacing: -.035em; margin-bottom: 5px\">Web+mobile<\u002Fdiv>\n              <div style=\"font-size: 12.5px; font-weight: 500; opacity: .78\">Apps, themes, SaaS, React Native<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n            <span style=\"border: 2px solid var(--paper, #FDF6EC); border-radius: var(--rad, 0px); padding: 5px 10px; border-radius: var(--rad, 0px); font-size: 12.5px; font-weight: 500\">Shopify apps<\u002Fspan>\n            <span style=\"border: 2px solid var(--paper, #FDF6EC); border-radius: var(--rad, 0px); padding: 5px 10px; border-radius: var(--rad, 0px); font-size: 12.5px; font-weight: 500\">Liquid · OS 2.0<\u002Fspan>\n            <span style=\"border: 2px solid var(--paper, #FDF6EC); border-radius: var(--rad, 0px); padding: 5px 10px; border-radius: var(--rad, 0px); font-size: 12.5px; font-weight: 500\">React<\u002Fspan>\n            <span style=\"border: 2px solid var(--paper, #FDF6EC); border-radius: var(--rad, 0px); padding: 5px 10px; border-radius: var(--rad, 0px); font-size: 12.5px; font-weight: 500\">TypeScript<\u002Fspan>\n            <span style=\"border: 2px solid var(--paper, #FDF6EC); border-radius: var(--rad, 0px); padding: 5px 10px; border-radius: var(--rad, 0px); font-size: 12.5px; font-weight: 500\">Node.js<\u002Fspan>\n            <span style=\"border: 2px solid var(--paper, #FDF6EC); border-radius: var(--rad, 0px); padding: 5px 10px; border-radius: var(--rad, 0px); font-size: 12.5px; font-weight: 500\">Laravel<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <div data-reveal=\"\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 18px\">\n      <article style=\"border: 3px solid var(--ink, #16150F); border-radius: var(--rad, 0px); background: var(--paper, #FDF6EC); padding: 22px\">\n        <svg sc-camel-view-box=\"0 0 120 70\" width=\"120\" height=\"70\" role=\"img\" aria-label=\"Flat vector icon: API endpoints\" style=\"display: block; margin-bottom: 16px\">\n " width=\"120\" height=\"70\" role=\"img\" aria-label=\"Flat vector icon: client platform and database\" style=\"display: block; margin-bottom: 16px\">\n          <g style=\"stroke: var(--ink, #16150F); stroke-width: 3\">\n            <rect x=\"8\" y=\"12\" width=\"48\" height=\"46\" style=\"fill: var(--acc, #E8562A); rx: var(--rad, 0px)\"><\u002Frect>\n            <ellipse cx=\"90\" cy=\"22\" rx=\"22\" ry=\"9\" style=\"fill: var(--paper, #FDF6EC)\"><\u002Fellipse>\n            <path d=\"M68 22 L68 50\" style=\"fill: none\"><\u002Fpath>\n            <path d=\"M112 22 L112 50\" style=\"fill: none\"><\u002Fpath>\n            <ellipse cx=\"90\" cy=\"50\" rx=\"22\" ry=\"9\" style=\"fill: var(--ter, #F5C542)\"><\u002Fellipse>\n            <path d=\"M56 35 L68 35\" style=\"fill: none\"><\u002Fpath>\n          <\u002Fg>\n        <\u002Fsvg>\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 12px\">\n          <span style=\"font-family: 'Roboto Mono', monospace; font-size: 11.5px; font-weight: 500; color: var(--acc, #E8562A)\">05<\u002Fspan>\n          <span style=\"font-size: 12.5px; opacity: .7\">morrocow3 · 2018 — 2019<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"font-size: 20px; font-weight: 900; letter-spacing: -.025em; line-height: 1.18; margin: 0 0 11px\">Custom platforms, built with the clients who ran them<\u002Fh3>\n        <p style=\"font-size: 14.5px; line-height: 1.56; margin: 0 0 16px; opacity: .8\">Where the client work started: Laravel and MySQL platforms, REST integrations, and the habit of sitting with a client until the requirement is understood.<\u002Fp>\n        <div style=\"padding-top: 14px; border-top: 2px solid var(--ink, #16150F); font-family: 'Roboto Mono', monospace; font-size: 11.5px; opacity: .7\">Laravel · PHP · JavaScript · MySQL<\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"experience\" style=\"max-width: 1240px; margin: 0 auto; padding: clamp(52px, 9vh, 100 uid themes on Online Store 2.0 and merchant SaaS — plus the API, webhook and OAuth plumbing that keeps them in sync.\",\n          stack: \"Shopify apps · Liquid · OS 2.0 · Webhooks\" },\n        { n: \"B\", tag: \"Frontend systems\", title: \"React interfaces that stay maintainable\",\n          body: \"Typed, reusable component architecture for product surfaces other engineers extend after me. Performance and reliability treated as design constraints, not cleanup.\",\n          stack: \"React · TypeScript · React Native · Angular\" },\n        { n: \"C\", tag: \"Backend & APIs\", title: \"Two mature server stacks, chosen deliberately\",\n          body: \"Node.js and Laravel/PHP, picked by fit rather than habit. Scalable APIs, third-party integrations, and data models built to be secure and to survive a rewrite.\",\n          stack: \"Node.js · Laravel · PHP · MySQL · REST\" },\n        { n: \"D\", tag: \"AI & automation\", title: \"AI wired into product flows\",\n          body: \"My top-rated skills are AI integration and automation: features that remove real work from real users, built into the product rather than bolted on as a demo.\",\n          stack: \"AI integration · Automations · Jobs\" },\n        { n: \"E\", tag: \"Architecture & delivery\", title: \"Strategy, architecture, then shipping\",\n          body: \"Setting a roadmap, designing the architecture, running code review and CI/CD, and raising the team's standards — the part of seniority that isn't syntax.\",\n          stack: \"System design · CI/CD · Review · Mentoring\" }\n      ],\n      principles: [\n        { n: \"01\", title: \"Architecture is a maintenance decision\",\n          body: \"Scalable, secure and maintainable is one requirement, not three. I design for the engineer who inherits the codebase, because for three years that engineer has been on my team.\" },\n        { n: \"02\", title: \"Product thinking before implementation\",\n          body: \"Owning a roadmap changed how I write code: the fastest solution is usually the one that answers the actual business need instead of the ticket's literal wording.\" },\n        { n: \"03\", title: \"Clean, reusable code is the performance strategy\",\n          body: \"Most reliability and performance gains I've shipped came from removing duplication and clarifying boundaries — not from micro-optimising hot paths.\" },\n        { n: \"04\", title: \"Automate first, then add AI\",\n          body: \"I look for the repetitive work before reaching for a model. When AI does belong, it goes inside an existing flow with clear inputs, review and a fallback.\" }\n      ]\n    };\n  }\n\n  componentDidMount() {\n    this.applyTheme();\n\n    this._tick = setInterval(() => {\n      if (this.state.tvOpen && this.state.power) this.setState(s => ({ secs: s.secs + 1 }), () => this.forceUpdate());\n    }, 1000);\n\n    this._tvKey = e => {\n      if (!this.state.tvOpen) return;\n      const k = (e.key || \"\").toLowerCase();\n      if (k === \"escape\") { this.setState({ tvOpen: false }); return; }\n      if (/^[1-9]$/.test(k)) { e.preventDefault(); this.tune(Number(k)); return; }\n      if (k === \"arrowup\") { e.preventDefault(); this.tune(this.state.ch + 1); }\n      else if (k === \"arrowdown\") { e.preventDefault(); this.tune(this.state.ch - 1); }\n      else if (k === \"arrowright\") { e.preventDefault(); this.setState(s => ({ vol: Math.min(10, s.vol + 1), muted: false })); this.showVol(); }\n      else if (k === \"arrowleft\") { e.preventDefault(); this.setState(s => ({ vol: Math.max(0, s.vol - 1) })); this.showVol(); }\n      else if (k === \"m\") { this.setState(s => ({ muted: !s.muted })); this.showVol(); }\n      else if (k === \"c\") { this.setState(s => ({ cc: !s.cc })); }\n      else if (k === \"p\" || k === \" \") { e.preventDefault(); this.setState(s => ({ power: !s.power, tuning: false })); }\n    };\n    window.addEventListener(\"keydown\", this._tvKey);\n    const reduce = (this.props.reduceMotion ?? false) ||\n      (window.matchMedia && window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches);\n    if (reduce || !Element.prototype.animate) return;\n\n    const targets = document.querySelectorAll(\"[data-reveal]\");\n    const hold = new Map();\n    targets.forEach(el => {\n      if (el.getBoundingClientRect().top > window.innerHeight * 0.92) {\n        hold.set(el, el.animate([{ opacity: 0 }, { opacity: 0 }], { duration: 60000, fill: \"none\" }));\n      }\n    });\n    this._io = new IntersectionObserver(entries => {\n      entries.forEach(e => {\n        if (!e.isIntersecting) return;\n        const el = e.target;\n        const held = hold.get(el);\n        if (held) { held.cancel(); hold.delete(el); }\n        el.animate([{ opacity: 0, transform: \"translateY(14px)\" }, { opacity: 1, transform: \"none\" }],\n          { duration: 560, easing: \"cubic-bezier(.22,1,.36,1)\", fill: \"none\" });\n        this._io.unobserve(el);\n      });\n    }, { rootMargin: \"0px 0px -8% 0px\", threshold: 0.06 });\n    targets.forEach(el => this._io.observe(el));\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._tick);\n    clearTimeout(this._tuneT);\n    clearTimeout(this._volT);\n    window.removeEventListener(\"keydown\", this._tvKey);\n    if (this._io) this._io.disconnect();\n    document.querySelectorAll(\"[data-reveal]\").forEach(el => el.getAnimations().forEach(a => a.cancel()));\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
